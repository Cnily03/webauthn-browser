[package]
name = "fido-report-relay"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt", "net", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
