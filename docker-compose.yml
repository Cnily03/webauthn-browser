services:
  webauthn-browser:
    image: webauthn-browser
    build: .
    restart: unless-stopped
    command: ["--no-sandbox"]
    # This .data belongs exclusively to this service. Never share it with a
    # concurrently running container/browser; see docs/runtime-storage.md.
    environment:
      AUTH_BROWSER_EXCLUSIVE_PROFILE: "true"
    volumes:
      - "./.data:/data"
      - "./downloads:/downloads:ro"
    tmpfs:
      - "/data/run:uid=10001,gid=10001,mode=0700"
      - "/tmp/webauthn-browser-cache:uid=10001,gid=10001,mode=0700"
    ports:
      - "8080:8080"
