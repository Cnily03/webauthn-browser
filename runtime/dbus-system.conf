<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Container-private compatibility bus. Never includes host system policy. -->
  <type>system</type>
  <listen>unix:path=/data/run/dbus-system.sock</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <deny user="*"/>
    <!-- Connection admission is bus-global, not a per-user message rule. -->
    <allow user="authbrowser"/>
    <deny own="*"/>
    <deny send_destination="*"/>
    <deny receive_sender="*"/>
  </policy>
  <policy user="authbrowser">
    <allow own="org.bluez"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
  <limit name="max_message_size">1048576</limit>
  <limit name="max_connections_per_user">64</limit>
</busconfig>
